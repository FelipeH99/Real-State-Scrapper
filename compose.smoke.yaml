services:
  fixture:
    image: python:3.12-slim-bookworm
    user: '10001:10001'
    command: [python, /fixtures/server.py]
    read_only: true
    volumes:
      - ./tests/fixtures/deploy:/fixtures:ro
  worker:
    environment:
      ESTATE_SOURCES_CONFIG: /fixtures/sources.json
    volumes:
      - ./tests/fixtures/deploy:/fixtures:ro
    depends_on: [fixture]
